# .cargo/config.toml (rust-agents-proxy)
# - 전역 vendor 대신 프로젝트 vendor 사용 (전역 vendor 에 tokio·hyper·ratatui 없음)
# - vendor 재생성: cargo vendor --config net.offline=false vendor

[source.crates-io]
replace-with = "project-vendor"

[source.project-vendor]
directory = "vendor"

[env]
CC_x86_64_pc_windows_gnullvm = "C:/JUNGHO/1.Language/8.Clang/bin/clang.exe"
AR_x86_64_pc_windows_gnullvm = "C:/JUNGHO/1.Language/8.Clang/bin/ar.exe"
# build.rs 아이콘·버전 리소스 컴파일러
WINDRES = "C:/JUNGHO/1.Language/8.Clang/bin/x86_64-w64-mingw32-windres.exe"

[target.x86_64-pc-windows-gnullvm]
linker = "C:/JUNGHO/1.Language/8.Clang/bin/x86_64-w64-mingw32-clang.exe"
