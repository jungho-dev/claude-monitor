# rap.example.toml
# - 복사 위치: %LOCALAPPDATA%\rust-agents-proxy\rap.toml (또는 --config, RAP_CONFIG)
# - 모든 키 생략 가능, 생략 시 아래 기본값

# data_dir = "C:/Users/<user>/AppData/Local/rust-agents-proxy"
# claude_home = "C:/Users/<user>/.claude"

# 포트 (127.0.0.1 전용)
[ports]
admin = 47330
otlp = 47331
gateway = 47332
hooks = 47333

# API 게이트웨이 (ANTHROPIC_BASE_URL=http://127.0.0.1:47332 와 함께 사용)
[gateway]
enabled = false
upstream = "https://api.anthropic.com"
upstream_timeout_secs = 900

# 훅 가속 (pretool-chain: 재작성 후 기존 가드 재검사)
[hooks]
enabled = true
relay_target = "http://127.0.0.1:47321"
rewrite_enabled = true
guard_deadline_ms = 3000

# 세션 기록 색인
[indexer]
enabled = true
# projects_dir = "C:/Users/<user>/.claude/projects"
interval_secs = 30
backfill_days = 7

# 일일 리포트
[report]
enabled = true
# dir = "C:/Users/<user>/AppData/Local/rust-agents-proxy/reports"
run_hour = 0
