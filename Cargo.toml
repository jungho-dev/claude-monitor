# Cargo.toml

[package]
name = "claude-monitor"
version = "0.1.4"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Always-on localhost hub for Claude Code: OTLP intake, transcript index, hook speedups, API gateway, and a live TUI."
readme = "README.md"
repository = "https://github.com/jungho-dev/claude-monitor"
documentation = "https://docs.rs/claude-monitor"
keywords = ["claude-code", "otlp", "hooks", "gateway", "tui"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
  "/.cargo",
  "/.claude",
  "/.cmd",
  "/.docs",
  "/.github",
  "/.vscode",
  "/.gitignore",
  "/.gitignore-private",
  "/.gitignore-public",
  "/CLAUDE.md",
  "/assets/icon/*.webp",
  "/assets/icon/build_icon.py",
  "/vendor",
]

[[bin]]
name = "claude-monitor"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
flate2 = "1.1.11"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "client", "http1", "http2"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "http2", "ring", "webpki-roots", "tls12"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "client-legacy", "http1", "http2"] }
ratatui = "0.30.2"
ring = "0.17.14"
rusqlite = { version = "0.43.0", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs", "signal"] }
toml = "1.2.1"
tower-service = "0.3"
unicode-width = "0.2.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# 태스크 단위 panic 격리 (단일 프로세스 다중 포트)
panic = "unwind"
